# ============================================================
# Rex MFBank - NIP Transfer Service
# ============================================================

spring:
  application:
    name: nip-transfer-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nip_transfer_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway handles schema — Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

# API Key — override with strong secret in production (env var)
app:
  api-key: ${API_KEY:dev-api-key-change-in-production}

# Actuator — expose health and info for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.rexmfbank: DEBUG
    org.springframework.security: WARN
